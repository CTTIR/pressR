# Versioned successor contract; the 0.1.0 baseline remains preserved.
on:
  push:
    branches: [main, master, 'production/**']
  pull_request:
    branches: [main, master]

name: api-lock

permissions: read-all

jobs:
  api-lock:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Without NOT_CRAN, expect_snapshot() skips silently and the lock
      # becomes a no-op that still reports green.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://cttir.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Run the API lock only
        run: |
          testthat::test_local(
            path   = "tests/testthat",
            filter = "api-lock",
            reporter = testthat::MultiReporter$new(list(
              testthat::ProgressReporter$new(),
              testthat::CheckReporter$new()
            ))
          )
        shell: Rscript {0}

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The successor API differs from its reviewed snapshot."
          echo "Review the change and document migration before updating the contract."
          exit 1
