on:
  push:
    branches: [main, master, 'production/**']
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    uses: CTTIR/.github/.github/workflows/lint.yaml@main
    with:
      # Gate vocabulary without renaming existing verbose arguments merely for style.
      vocabulary-only: true
      blocking: true
