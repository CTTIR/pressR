name: production-integration
on:
  push:
    branches: [main, master, 'production/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports-and-browser:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: 'true'
      R_KEEP_PKG_SOURCE: 'yes'
      PRESSR_DATA_ROOT: /nonexistent-private-data
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2, any::pkgload, local::.
          needs: check
      - name: Require browser and report dependencies
        run: |
          stopifnot(nzchar(chromote::find_chrome()), rmarkdown::pandoc_available(), nzchar(Sys.which('pdflatex')))
        shell: Rscript {0}
      - name: Render every report template as HTML and PDF
        env:
          PRESSR_ACCEPTANCE_OUT: ${{ runner.temp }}/pressr-reports
        run: Rscript dev/production/audit-reports.R
      - name: Exercise browser upload, comparison, temporal analysis and downloads
        env:
          PRESSR_ACCEPTANCE_OUT: ${{ runner.temp }}/pressr-browser
        run: Rscript dev/production/audit-browser.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-integration-evidence
          path: |
            ${{ runner.temp }}/pressr-reports
            ${{ runner.temp }}/pressr-browser
  minimum-r:
    runs-on: ubuntu-22.04
    env:
      NOT_CRAN: 'true'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check declared minimum R
        run: rcmdcheck::rcmdcheck(args=c('--no-manual','--as-cran'), error_on='warning')
        shell: Rscript {0}
