url: https://cttir.github.io/pressR/

template:
  package: themakR

development:
  mode: auto
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/cttir/pressR

reference:
  - title: "Parsers"
    desc: "Read pressure data from various file formats"
    contents:
      - pr_read_ascii
      - pr_read_csv
      - pr_read_forcesensor
      - pr_read_mask
      - pr_read_auto
  - title: "Sensor Layouts"
    desc: "Predefined and custom sensor coordinate layouts"
    contents:
      - pr_layout
      - pr_layout_insole
      - pr_layout_platform
      - pr_layout_mat
      - pr_layout_saddle
      - pr_layout_seat
      - pr_layout_glove
      - pr_layout_list
      - pr_validate_layout
  - title: "S3 Classes"
    contents:
      - pr_trial
      - pr_dataset
      - pr_cop
      - pr_mask
  - title: "Region Masks"
    contents:
      - pr_mask_default
      - pr_mask_apply
      - pr_mask_foot_auto
      - pr_mask_saddle_6
      - pr_mask_symmetry
  - title: "Per-Frame Analysis"
    contents:
      - pr_calc_peak_pressure
      - pr_calc_mean_pressure
      - pr_calc_force
      - pr_calc_contact_area
      - pr_calc_cop
      - pr_calc_loaded_rate
      - pr_calc_pti
      - pr_calc_impulse
      - pr_calc_contact_time
      - pr_calc_cop_path
      - pr_calc_cop_excursion
  - title: "Trial Summary"
    contents:
      - pr_summary
      - pr_calc_symmetry_index
  - title: "Regional Analysis"
    contents:
      - pr_calc_regional
  - title: "Application-Specific Analysis"
    contents:
      - pr_calc_gait_cycles
      - pr_calc_rollover
      - pr_calc_saddle_bridge
      - pr_calc_saddle_slip
      - pr_calc_seat_hotspot
  - title: "Reference Thresholds"
    contents:
      - pr_ref_saddle
      - pr_ref_diabetic_foot
      - pr_ref_wheelchair
  - title: "Visualization"
    contents:
      - pr_plot_heatmap
      - pr_plot_heatmap_masked
      - pr_plot_3d
      - pr_plot_force_time
      - pr_plot_pressure_time
      - pr_plot_cop
      - pr_plot_cop_butterfly
      - pr_plot_contact_area
      - pr_plot_regional_bar
      - pr_plot_symmetry
      - pr_plot_comparison
      - pr_plot_saddle_report
      - pr_plot_foot_report
      - plot.pr_layout
      - plot.pr_trial
  - title: "Export & Reporting"
    contents:
      - pr_export_csv
      - pr_export_report
  - title: "Batch Processing"
    contents:
      - pr_batch_summary
      - pr_merge_trials
  - title: "Shiny Application"
    contents:
      - pr_run_app
  - title: "Example Data"
    contents:
      - pr_example_trial
      - pr_example_files
  - title: "Utilities"
    contents:
      - pr_interpolate
      - pr_filter_time
      - pr_downsample

  - title: "Cohort Ingest"
    desc: >
      Read a whole study into one object: a Pliance/Novel .asc reader that
      honours the recorded time column and the device channel map, directory
      batch reading, and filename-derived metadata.
    contents:
      - pr_read_pliance
      - pr_read_dir
      - pr_meta_from_filename
  - title: "Device Channel Maps"
    desc: >
      Layouts built from an explicit channel-to-grid index map, for devices
      whose channel order is not the grid's column-major order.
    contents:
      - pr_layout_from_index_map
      - pr_layout_saddle_novel
      - pr_channel_order
  - title: "Cohort Handling"
    desc: "Design tables, filtering as an assertion, and dataset validation."
    contents:
      - pr_design_table
      - pr_dataset_filter
      - pr_assert_cohort
      - pr_validate_dataset
  - title: "Frame Metrics (whole-grid)"
    desc: >
      Whole-grid counterparts to the loaded-cell family. See the details on
      each for the denominator distinction.
    contents:
      - pr_frame_metrics
      - pr_calc_mean_pressure_grid
      - pr_calc_total_pressure
      - pr_calc_loaded_count
      - pr_calc_cop_grid
      - pr_calc_pci
      - pr_ref_pci
  - title: "Per-Sensor Maps"
    desc: "Time-averaged per-sensor statistics, feature matrices, and streaming cohort summaries."
    contents:
      - pr_sensor_map
      - pr_profile_matrix
      - pr_batch_frame_summary
  - title: "Sensor Quality and Gradients"
    contents:
      - pr_sensor_quality
      - pr_calc_gradient
  - title: "Zones and Symmetry"
    desc: >
      Row-band masks with an explicit split, zone statistics on the
      time-averaged map, and symmetry with a mirror-balance control.
    contents:
      - pr_mask_rowbands
      - pr_calc_regional_map
      - pr_calc_symmetry_map
      - pr_mask_mirror_balance
      - pr_symmetry_sensitivity
      - pr_calc_cop_masked
  - title: "Temporal Structure"
    desc: >
      Spectra and oscillation-based stride detection, for continuously loaded
      sensors that never unload between contacts.
    contents:
      - pr_calc_spectrum
      - pr_calc_dominant_freq
      - pr_calc_stride_cycles
      - pr_calc_phase_map
      - pr_cop_shape
  - title: "Provenance and Design Integrity"
    contents:
      - pr_lock_table
      - pr_verify_lock
      - pr_validate_summary
      - pr_factor_contract
      - pr_design_gaps
articles:
  - title: "Getting Started"
    contents:
      - getting-started
  - title: "Application Workflows"
    contents:
      - saddle-pressure-analysis
      - foot-pressure-analysis
